  <style>
    /* ══════════════════════════════════════════
       CONSTANCE PAGE — COLOR TOKENS
    ══════════════════════════════════════════ */
    :root {
      --cn-teal:   #006466;
      --cn-teal-2: #0d9488;
      --cn-light:  #e6f4f4;
      --cn-bg:     #f7fafa;
    }

    /* ── Base ── */
    html, body { margin: 0; padding: 0; }
    body { background: #fff; }

    /* ══════════════════════════════════════════
       HERO — SECTION 1
    ══════════════════════════════════════════ */
    #cn-hero {
      background: #fff;
      padding: 80px 40px 56px;
      max-width: 960px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* Back button */
    .cn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 14px 6px 10px;
      background: #fff;
      margin-bottom: 40px;
      transition: border-color 0.2s, color 0.2s;
    }
    .cn-back:hover { border-color: var(--ink); color: var(--ink); }
    .cn-back svg { width: 14px; height: 14px; }

    /* Project label */
    .cn-project-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-3);
      margin-bottom: 16px;
      letter-spacing: 0.01em;
    }
    .cn-project-label span {
      color: var(--cn-teal);
      font-weight: 600;
    }

    /* Hero heading */
    .cn-hero-heading {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 48px;
    }
    .cn-hero-heading .cn-accent { color: var(--cn-teal); }

    /* Meta row */
    .cn-meta-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border);
    }

    .cn-meta-item {
      padding: 20px 24px;
      border-right: 1px solid var(--border);
    }
    .cn-meta-item:last-child { border-right: none; }

    .cn-meta-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--cn-teal);
      margin-bottom: 6px;
    }
    .cn-meta-label i { font-size: 14px; }

    .cn-meta-value {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      line-height: 1.4;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      #cn-hero { padding: 72px 24px 40px; }
      .cn-meta-row { grid-template-columns: repeat(2, 1fr); }
      .cn-meta-item:nth-child(2) { border-right: none; }
      .cn-meta-item:nth-child(3) { border-top: 1px solid var(--border); }
      .cn-meta-item:nth-child(4) { border-top: 1px solid var(--border); border-right: none; }
    }
    @media (max-width: 480px) {
      #cn-hero { padding: 64px 20px 32px; }
      .cn-hero-heading { font-size: clamp(24px, 8vw, 36px); margin-bottom: 32px; }
      .cn-meta-row { grid-template-columns: 1fr 1fr; }
      .cn-meta-item { padding: 16px; }
    }

    /* ══════════════════════════════════════════
       INTRO IMAGE — SECTION 2
    ══════════════════════════════════════════ */
    #cn-intro {
      width: 100%;
      background: var(--cn-bg);
      padding: 0 40px 64px;
      box-sizing: border-box;
    }
    .cn-intro-frame {
      max-width: 960px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,100,102,0.12), 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,100,102,0.1);
      cursor: zoom-in;
    }
    .cn-intro-frame img {
      width: 100%;
      display: block;
      border-radius: 16px;
    }

    /* Placeholder shown when no real image provided */
    .cn-intro-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #e6f4f4 0%, #c8e8e8 40%, #006466 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: rgba(255,255,255,0.9);
      font-size: 15px;
      font-weight: 600;
    }
    .cn-intro-placeholder i { font-size: 40px; opacity: 0.6; }

    @media (max-width: 768px) {
      #cn-intro { padding: 0 20px 40px; }
      .cn-intro-frame { border-radius: 12px; }
    }
    @media (max-width: 480px) {
      #cn-intro { padding: 0 16px 32px; }
    }
  </style>

<script>
// ── Menu toggle ──
function toggleMenu() {
  var panel = document.getElementById('menu-panel');
  var overlay = document.getElementById('menu-overlay');
  panel.classList.toggle('open');
  if (overlay) overlay.classList.toggle('open');
}

// ── Nav typing ──
(function() {
  var messages = ['Constance · Case Study', 'AI Risk Prediction', 'Richard Paul'];
  var mi = 0, ci = 0, deleting = false;
  var el = document.getElementById('nav-typed');
  if (!el) return;
  function tick() {
    var msg = messages[mi];
    if (!deleting) {
      ci++;
      el.textContent = msg.slice(0, ci);
      if (ci === msg.length) { deleting = true; setTimeout(tick, 2000); return; }
    } else {
      ci--;
      el.textContent = msg.slice(0, ci);
      if (ci === 0) { deleting = false; mi = (mi + 1) % messages.length; }
    }
    setTimeout(tick, deleting ? 40 : 80);
  }
  setTimeout(tick, 600);
})();
</script>
